name: Sync Upstream

on:
  schedule:
    # Daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/OHF-Voice/wyoming-faster-whisper.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream --tags

      - name: Merge and push upstream changes
        run: |
          git checkout main
          if [ "$(git rev-parse main)" = "$(git rev-parse upstream/main)" ]; then
            echo "Already up to date. Nothing to push."
            exit 0
          fi
          # Fork policy: this fork owns README.md (a barebones GPU-focused
          # readme). Merge with --no-commit, then force the fork's README back
          # in whether the merge conflicted on it or auto-merged cleanly, so
          # upstream's version can never win here. Other fork-only files (the
          # added workflows) have no upstream counterpart, so they cannot
          # conflict. If any other file genuinely conflicts, the commit below
          # fails and the run goes red for a human to resolve.
          git merge upstream/main --no-edit --no-commit || true
          git checkout HEAD -- README.md
          git add README.md
          git commit --no-edit
          git push origin main
          git push origin --tags || true