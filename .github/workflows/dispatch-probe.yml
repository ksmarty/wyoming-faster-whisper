name: Dispatch Probe

# Temporary: proves the sync workflow can start Build and Push GPU Image with
# the repository's own GITHUB_TOKEN (actions: write). Deleted after the check.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the image build the same way the sync workflow does
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run build-gpu.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 10
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build-gpu.yml --limit 3
